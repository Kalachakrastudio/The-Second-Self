<div class="judge-page">

    <!-- Toolbar -->

    <div class="page-toolbar">

        <div class="toolbar-left">

            <div class="event-selector">

                <select id="judgeEvent">

                    <option value="">Loading Event...</option>

                </select>

            </div>

        </div>

    </div>

    <!-- Stats -->

    <div class="judge-stats">

        <div class="judge-stat">

            <i class="fa-solid fa-microphone"></i>

            <div>

                <h2 id="judgePerformerCount">0</h2>

                <p>Performers</p>

            </div>

        </div>

        <div class="judge-stat">

            <i class="fa-solid fa-check"></i>

            <div>

                <h2 id="judgeScoredCount">0</h2>

                <p>Scored</p>

            </div>

        </div>

        <div class="judge-stat">

            <i class="fa-solid fa-clock"></i>

            <div>

                <h2 id="judgePendingCount">0</h2>

                <p>Pending</p>

            </div>

        </div>

    </div>

    <!-- Performer Cards -->

    <div id="judgeCards" class="judge-cards">

        <div class="empty">

            Select today's event

        </div>

    </div>

</div>
<!-- Judge Score Modal -->

<div id="judgeScoreModal" class="modal">

    <div class="modal-box score-modal">


        <div class="modal-header">

            <h2>
                <i class="fa-solid fa-star"></i>
                Give Score
            </h2>


            <button onclick="closeJudgeModal()">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>



        <div class="modal-body">


            <h3 id="judgePerformerName"></h3>


            <p id="judgePerformerCategory"></p>



            <div class="score-number-box">


                <p>Select Score (1-10)</p>


                <div class="score-buttons">


                    <button onclick="selectScore(this,1)">1</button>
                    <button onclick="selectScore(this,2)">2</button>
                    <button onclick="selectScore(this,3)">3</button>
                    <button onclick="selectScore(this,4)">4</button>
                    <button onclick="selectScore(this,5)">5</button>
                    <button onclick="selectScore(this,6)">6</button>
                    <button onclick="selectScore(this,7)">7</button>
                    <button onclick="selectScore(this,8)">8</button>
                    <button onclick="selectScore(this,9)">9</button>
                    <button onclick="selectScore(this,10)">10</button>


                </div>


            </div>



            <button
            class="primary-btn"
            onclick="submitJudgeScore()"
            >

            Submit Score

            </button>


        </div>


    </div>

</div>
<div id="successPopup" class="success-popup">


<div class="success-box">

<i class="fa-solid fa-circle-check"></i>

<h3 id="successMessage">
Score Saved
</h3>


</div>


</div>
