<div class="judge-page">

    <!-- Toolbar -->

    <div class="page-toolbar">

        <div class="toolbar-left">

            <div class="event-selector">

                <select id="judgeEvent">

                    <option value="">Loading Event...</option>

                </select>

            </div>

        </div>

    </div>

    <!-- Stats -->

    <div class="judge-stats">

        <div class="judge-stat">

            <i class="fa-solid fa-microphone"></i>

            <div>

                <h2 id="judgePerformerCount">0</h2>

                <p>Performers</p>

            </div>

        </div>

        <div class="judge-stat">

            <i class="fa-solid fa-check"></i>

            <div>

                <h2 id="judgeScoredCount">0</h2>

                <p>Scored</p>

            </div>

        </div>

        <div class="judge-stat">

            <i class="fa-solid fa-clock"></i>

            <div>

                <h2 id="judgePendingCount">0</h2>

                <p>Pending</p>

            </div>

        </div>

    </div>

    <!-- Performer Cards -->

    <div id="judgeCards" class="judge-cards">

        <div class="empty">

            Select today's event

        </div>

    </div>

</div>
<!-- Judge Score Modal -->

<div id="judgeScoreModal" class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>

                <i class="fa-solid fa-star"></i>

                Judge Scoring

            </h2>

            <button onclick="closeJudgeModal()">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <div class="modal-body">

            <h3 id="judgePerformerName"></h3>

            <p id="judgePerformerCategory"></p>

            <div class="score-group">

                <label>Story</label>

                <input
                    type="number"
                    id="storyScore"
                    min="1"
                    max="10"
                >

            </div>

            <div class="score-group">

                <label>Performance</label>

                <input
                    type="number"
                    id="performanceScore"
                    min="1"
                    max="10"
                >

            </div>

            <div class="score-group">

                <label>Expression</label>

                <input
                    type="number"
                    id="expressionScore"
                    min="1"
                    max="10"
                >

            </div>

            <div class="score-group">

                <label>Comment</label>

                <textarea
                    id="judgeComment"
                    rows="4"
                ></textarea>

            </div>

            <button
                class="primary-btn"
                onclick="submitJudgeScore()"
            >

                Submit Score

            </button>

        </div>

    </div>

</div>
