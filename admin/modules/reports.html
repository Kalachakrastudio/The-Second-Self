<div class="reports-page">


<div class="reports-toolbar">


<div class="report-select">

<select id="reportType">

<option value="">
Select Report
</option>

<option value="performers">
Performers
</option>

<option value="bookings">
Bookings
</option>

<option value="partners">
Partners
</option>

</select>

</div>



<div class="report-search">

<i class="fa-solid fa-magnifying-glass"></i>

<input 
id="reportSearch"
placeholder="Search report...">

</div>



<button 
class="primary-btn"
id="exportReport">

<i class="fa-solid fa-file-export"></i>

Export

</button>


</div>


<div class="report-table-wrapper">


<table class="report-table">

<thead id="reportHead">

</thead>


<tbody id="reportBody">

</tbody>


</table>


</div>



</div>

<!-- =========================================
PARTNER CRM MODAL
========================================= -->

<div id="partnerModal" class="modal">


<div class="modal-box partner-crm">


<!-- HEADER -->

<div class="modal-header">

<h2>
<i class="fa-solid fa-handshake"></i>
Partner CRM
</h2>


<button 
type="button"
id="closePartnerModal">

<i class="fa-solid fa-xmark"></i>

</button>


</div>



<!-- COMPANY INFORMATION -->

<div class="crm-section">


<h3>
Company Information
</h3>


<div 
id="partnerCompanyInfo"
class="crm-grid">


</div>


</div>




<!-- SPONSORSHIP DETAILS -->

<div class="crm-section">


<h3>
Sponsorship Details
</h3>


<div 
id="partnerSponsorInfo"
class="crm-grid">


</div>


</div>





<!-- FOLLOW UP FORM -->

<div class="crm-section">


<h3>
Add Follow-up
</h3>



<div class="crm-form">


<div class="form-group">

<label>Status</label>

<select id="followupStatus" class="custom-select">

<option value="">
Select Status
</option>

<option value="Pending">
Pending
</option>

<option value="Completed">
Completed
</option>

<option value="Rejected">
Rejected
</option>

</select>
</div>




<div class="form-group">


<label>
Next Follow-up Date
</label>


<input 
type="date"
id="nextFollowup">


</div>




<div class="form-group full">


<label>
Discussion Notes
</label>


<textarea
id="followupNotes"
placeholder="Enter discussion details..."
></textarea>


</div>



<button
id="saveFollowup"
class="primary-btn">


<i class="fa-solid fa-save"></i>

Save Follow-up


</button>



</div>


</div>






<!-- HISTORY -->

<div class="crm-section">


<h3>
Follow-up History
</h3>


<div 
id="followupTimeline"
class="timeline">


<div class="empty">

No follow-up history yet

</div>


</div>


</div>




</div>


</div>
