<div class="scoring-page">

    <!-- Toolbar -->

    <div class="page-toolbar">

        <div class="toolbar-left">

        <div class="event-selector">

    <select id="scoringEvent">

        <option value="">Select Event</option>

    </select>

</div>

        </div>

    </div>


    <!-- Stats -->

   <div class="score-stats">

    <div class="score-card">

        <i class="fa-solid fa-users"></i>

        <span>Total Performers</span>

        <h2 id="scorePerformerCount">0</h2>

        <small>Selected performers</small>

    </div>

    <div class="score-card">

        <i class="fa-solid fa-gavel"></i>

        <span>Judges</span>

        <h2 id="scoreJudgeCount">0</h2>

        <small>Assigned judges</small>

    </div>

    <div class="score-card">

        <i class="fa-solid fa-star"></i>

        <span>Audience Votes</span>

        <h2 id="scoreAudienceCount">0</h2>

        <small>Total audience votes</small>

    </div>

</div>

    <!-- Performer Table -->

    <div class="table-card">

        <table>

            <thead>

                <tr>

                    <th>Performer</th>

                    <th>Category</th>

                    <th>Judge Avg</th>

                    <th>Audience Avg</th>

                    <th>Final</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="scoringTable">

                <tr>

                    <td colspan="7" class="empty-row">

                        <i class="fa-solid fa-trophy"></i>

                        <p>Select an Event</p>

                        <small>

                            Choose an event to load scoring.

                        </small>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>
    <div id="performerScoreModal" class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>

                <i class="fa-solid fa-chart-line"></i>

                Performer Scores

            </h2>

            <button id="closeScoreModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <div id="performerScoreContent">

        </div>

    </div>

</div>

</div>
